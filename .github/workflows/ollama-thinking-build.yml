name: Build OllamaGPU Thinking UI (Intel)

on:
  push:
    paths:
      - '.github/workflows/ollama-thinking-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 25
    env:
      FORK_REV: dc3d6609e27fca7f9667147b37b939ed311bd8d4
      PATCH_BASE: 8a89b76cc7359805e48357ba7e5b99e845a4c211
      PATCH_HEAD: 0d8728f85fae6a84af1d3196ffa537db4330ddb3
    steps:
      - name: Fetch fixed source and reviewed upstream change
        shell: bash
        run: |
          set -euo pipefail
          git init source
          cd source
          git fetch --depth=1 https://github.com/baksogen/ollama_GPU.git "$FORK_REV"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$FORK_REV"
          git fetch --depth=1 https://github.com/ollama/ollama.git "$PATCH_BASE"
          git fetch --depth=1 https://github.com/ollama/ollama.git refs/pull/19648/head
          test "$(git rev-parse FETCH_HEAD)" = "$PATCH_HEAD"
          git diff --binary "$PATCH_BASE" "$PATCH_HEAD" -- \
            app/ui/app/codegen/gotypes.gen.ts \
            app/ui/app/src/api.ts \
            app/ui/app/src/components/ChatForm.tsx \
            app/ui/app/src/components/ThinkButton.tsx \
            app/ui/app/src/hooks/useModelCapabilities.ts \
            app/ui/responses/types.go \
            app/ui/ui.go > "$RUNNER_TEMP/thinking.patch"
          test -s "$RUNNER_TEMP/thinking.patch"
          git apply --check "$RUNNER_TEMP/thinking.patch"
          git apply "$RUNNER_TEMP/thinking.patch"
          git diff --check
          git diff --stat
      - name: Preserve user's Thinking preference across chat and model changes
        working-directory: source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/ui/app/src/components/ChatForm.tsx")
          src = p.read_text()
          reset = "  // When a toggle-only thinking model is selected, sync the toggle to the\n  // model's advertised default. Guarded by a ref so it only fires on model\n  // change — not when setSettings gets a new identity after a settings refetch\n  // (which would cause an infinite update loop).\n  const lastSyncedModelRef = useRef<string | undefined>(undefined);\n  useEffect(() => {\n    if (\n      supportsThinkToggling &&\n      modelThinking &&\n      selectedModel?.model !== lastSyncedModelRef.current\n    ) {\n      lastSyncedModelRef.current = selectedModel?.model;\n      setSettings({ ThinkEnabled: modelThinking.default !== false });\n    }\n  }, [supportsThinkToggling, modelThinking?.default, selectedModel?.model, setSettings]);\n"
          assert src.count(reset) == 1, "Expected exactly one upstream reset effect"
          src = src.replace(reset, "  // Gama: retain the persisted Thinking preference on remount and model switch.\n")
          assert "lastSyncedModelRef" not in src
          assert "setSettings({ ThinkEnabled: modelThinking.default !== false })" not in src
          p.write_text(src)
          PY
          git diff --check
      - name: Add per-response performance panel (collapsed by default)
        working-directory: source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          patches = json.loads("[[\"app/store/store.go\",\"type Message struct {\",\"// ResponsePerformance records the final inference pass, not live hardware usage.\\ntype ResponsePerformance struct {\\n\\tTotalNS int64 `json:\\\"total_ns\\\"`\\n\\tLoadNS int64 `json:\\\"load_ns\\\"`\\n\\tPromptTokens int `json:\\\"prompt_tokens\\\"`\\n\\tPromptNS int64 `json:\\\"prompt_ns\\\"`\\n\\tGeneratedTokens int `json:\\\"generated_tokens\\\"`\\n\\tGenerationNS int64 `json:\\\"generation_ns\\\"`\\n\\tSizeBytes int64 `json:\\\"size_bytes,omitempty\\\"`\\n\\tVRAMBytes int64 `json:\\\"vram_bytes,omitempty\\\"`\\n\\tContextLength int `json:\\\"context_length,omitempty\\\"`\\n}\\n\\ntype Message struct {\\n\\tPerformance *ResponsePerformance `json:\\\"performance,omitempty\\\"`\",1],[\"app/store/database.go\",\"const currentSchemaVersion = 19\",\"const currentSchemaVersion = 20\",1],[\"app/store/database.go\",\"\\t\\ttool_result TEXT,\\n\\t\\tFOREIGN KEY\",\"\\t\\ttool_result TEXT,\\n\\t\\tperformance_json TEXT,\\n\\t\\tFOREIGN KEY\",1],[\"app/store/database.go\",\"\\t\\t\\tversion = 19\\n\\t\\tdefault:\",\"\\t\\t\\tversion = 19\\n\\t\\tcase 19:\\n\\t\\t\\tif err := db.migrateV19ToV20(); err != nil {\\n\\t\\t\\t\\treturn fmt.Errorf(\\\"migrate v19 to v20: %w\\\", err)\\n\\t\\t\\t}\\n\\t\\t\\tversion = 20\\n\\t\\tdefault:\",1],[\"app/store/database.go\",\"func (db *database) cleanupOrphanedData() error {\",\"func (db *database) migrateV19ToV20() error {\\n\\t_, err := db.conn.Exec(`ALTER TABLE messages ADD COLUMN performance_json TEXT`)\\n\\tif err != nil && !duplicateColumnError(err) {\\n\\t\\treturn fmt.Errorf(\\\"add performance_json column: %w\\\", err)\\n\\t}\\n\\t_, err = db.conn.Exec(`UPDATE settings SET schema_version = 20`)\\n\\treturn err\\n}\\n\\nfunc (db *database) cleanupOrphanedData() error {\",1],[\"app/store/database.go\",\"thinking_time_end = ?, tool_result = ?\",\"thinking_time_end = ?, tool_result = ?, performance_json = ?\",1],[\"app/store/database.go\",\"thinking_time_end, tool_result\\n\\t\\tFROM messages\",\"thinking_time_end, tool_result, performance_json\\n\\t\\tFROM messages\",1],[\"app/store/database.go\",\"var toolResult sql.NullString\",\"var toolResult, performanceJSON sql.NullString\",1],[\"app/store/database.go\",\"\\t\\t\\t&toolResult,\\n\",\"\\t\\t\\t&toolResult,\\n\\t\\t\\t&performanceJSON,\\n\",1],[\"app/store/database.go\",\"\\t\\t// Set model if present\",\"\\t\\tif performanceJSON.Valid {\\n\\t\\t\\tvar metrics ResponsePerformance\\n\\t\\t\\tif err := json.Unmarshal([]byte(performanceJSON.String), &metrics); err == nil {\\n\\t\\t\\t\\tmsg.Performance = &metrics\\n\\t\\t\\t}\\n\\t\\t}\\n\\n\\t\\t// Set model if present\",1],[\"app/store/database.go\",\"thinking_time_end, tool_result)\\n\\t\\tVALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)\",\"thinking_time_end, tool_result, performance_json)\\n\\t\\tVALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)\",1],[\"app/store/database.go\",\"\\tresult, err := tx.Exec(query,\\n\",\"\\tvar performanceJSON sql.NullString\\n\\tif msg.Performance != nil {\\n\\t\\tif encoded, err := json.Marshal(msg.Performance); err == nil {\\n\\t\\t\\tperformanceJSON = sql.NullString{String: string(encoded), Valid: true}\\n\\t\\t}\\n\\t}\\n\\tresult, err := tx.Exec(query,\\n\",2],[\"app/store/database.go\",\"\\t\\ttoolResultJSON,\\n\",\"\\t\\ttoolResultJSON,\\n\\t\\tperformanceJSON,\\n\",2],[\"app/ui/ui.go\",\"\\t\\terr = c.Chat(ctx, chatReq, func(res api.ChatResponse) error {\\n\",\"\\t\\tvar performance *store.ResponsePerformance\\n\\t\\tvar responseModel string\\n\\t\\tvar remoteResponse bool\\n\\t\\terr = c.Chat(ctx, chatReq, func(res api.ChatResponse) error {\\n\\t\\t\\t// The final chunk can have no content; capture before the empty-chunk guard.\\n\\t\\t\\tif res.Done && (res.TotalDuration > 0 || res.EvalCount > 0 || res.PromptEvalCount > 0) {\\n\\t\\t\\t\\tperformance = &store.ResponsePerformance{\\n\\t\\t\\t\\t\\tTotalNS: int64(res.TotalDuration), LoadNS: int64(res.LoadDuration),\\n\\t\\t\\t\\t\\tPromptTokens: res.PromptEvalCount, PromptNS: int64(res.PromptEvalDuration),\\n\\t\\t\\t\\t\\tGeneratedTokens: res.EvalCount, GenerationNS: int64(res.EvalDuration),\\n\\t\\t\\t\\t}\\n\\t\\t\\t\\tresponseModel = res.Model\\n\\t\\t\\t\\tremoteResponse = res.RemoteHost != \\\"\\\" || res.RemoteModel != \\\"\\\"\\n\\t\\t\\t}\\n\",1],[\"app/ui/ui.go\",\"\\t\\tif !toolsExecuted {\\n\\t\\t\\tbreak\\n\\t\\t}\",\"\\t\\tif !toolsExecuted {\\n\\t\\t\\tif performance != nil && len(chat.Messages) > 0 && chat.Messages[len(chat.Messages)-1].Role == \\\"assistant\\\" {\\n\\t\\t\\t\\tif !remoteResponse {\\n\\t\\t\\t\\t\\tsnapshotCtx, cancel := context.WithTimeout(ctx, 500*time.Millisecond)\\n\\t\\t\\t\\t\\trunning, snapshotErr := c.ListRunning(snapshotCtx)\\n\\t\\t\\t\\t\\tcancel()\\n\\t\\t\\t\\t\\tif snapshotErr == nil && running != nil {\\n\\t\\t\\t\\t\\t\\tfor _, loaded := range running.Models {\\n\\t\\t\\t\\t\\t\\t\\tif loaded.Model == responseModel || loaded.Name == responseModel || loaded.Model == req.Model || loaded.Name == req.Model {\\n\\t\\t\\t\\t\\t\\t\\t\\tif loaded.Size > 0 && loaded.SizeVRAM >= 0 && loaded.SizeVRAM <= loaded.Size {\\n\\t\\t\\t\\t\\t\\t\\t\\t\\tperformance.SizeBytes = loaded.Size\\n\\t\\t\\t\\t\\t\\t\\t\\t\\tperformance.VRAMBytes = loaded.SizeVRAM\\n\\t\\t\\t\\t\\t\\t\\t\\t\\tperformance.ContextLength = loaded.ContextLength\\n\\t\\t\\t\\t\\t\\t\\t\\t}\\n\\t\\t\\t\\t\\t\\t\\t\\tbreak\\n\\t\\t\\t\\t\\t\\t\\t}\\n\\t\\t\\t\\t\\t\\t}\\n\\t\\t\\t\\t\\t}\\n\\t\\t\\t\\t}\\n\\t\\t\\t\\tchat.Messages[len(chat.Messages)-1].Performance = performance\\n\\t\\t\\t}\\n\\t\\t\\tbreak\\n\\t\\t}\",1],[\"app/ui/ui.go\",\"\\tjson.NewEncoder(w).Encode(responses.ChatEvent{EventName: \\\"done\\\"})\\n\\tflusher.Flush()\\n\\n\\tif len(chat.Messages) > 0 {\\n\\t\\tchat.Messages[len(chat.Messages)-1].Stream = false\\n\\t}\\n\\treturn s.Store.SetChat(*chat)\",\"\\tif len(chat.Messages) > 0 {\\n\\t\\tchat.Messages[len(chat.Messages)-1].Stream = false\\n\\t}\\n\\tif err := s.Store.SetChat(*chat); err != nil {\\n\\t\\treturn err\\n\\t}\\n\\tjson.NewEncoder(w).Encode(responses.ChatEvent{EventName: \\\"done\\\"})\\n\\tflusher.Flush()\\n\\treturn nil\",1],[\"app/ui/app/codegen/gotypes.gen.ts\",\"export class Message {\\n\",\"export interface ResponsePerformance {\\n    total_ns: number;\\n    load_ns: number;\\n    prompt_tokens: number;\\n    prompt_ns: number;\\n    generated_tokens: number;\\n    generation_ns: number;\\n    size_bytes?: number;\\n    vram_bytes?: number;\\n    context_length?: number;\\n}\\nexport class Message {\\n    performance?: ResponsePerformance;\\n\",1],[\"app/ui/app/codegen/gotypes.gen.ts\",\"        this.role = source[\\\"role\\\"];\\n        this.content = source[\\\"content\\\"];\\n        this.thinking = source[\\\"thinking\\\"];\",\"        this.performance = source[\\\"performance\\\"];\\n        this.role = source[\\\"role\\\"];\\n        this.content = source[\\\"content\\\"];\\n        this.thinking = source[\\\"thinking\\\"];\",1],[\"app/ui/app/src/components/Message.tsx\",\"import { Message as MessageType, ToolCall, File } from \\\"@/gotypes\\\";\",\"import { Message as MessageType, ToolCall, File } from \\\"@/gotypes\\\";\\nimport ResponsePerformancePanel from \\\"./ResponsePerformancePanel\\\";\",1],[\"app/ui/app/src/components/Message.tsx\",\"          <div className=\\\"-ml-1\\\">\\n            <CopyButton\",\"          <div className=\\\"-ml-1 flex flex-wrap items-start gap-2\\\">\\n            <CopyButton\",1],[\"app/ui/app/src/components/Message.tsx\",\"              title=\\\"Copy\\\"\\n            />\\n          </div>\\n        )}\\n    </div>\\n  );\\n}\",\"              title=\\\"Copy\\\"\\n            />\\n            {message.performance && <ResponsePerformancePanel performance={message.performance} model={message.model} />}\\n          </div>\\n        )}\\n    </div>\\n  );\\n}\",1]]")
          for filename, old, new, count in patches:
              p = Path(filename)
              src = p.read_text()
              assert src.count(old) == count, f"Unexpected anchor count: {filename}: {old[:80]}"
              p.write_text(src.replace(old, new))
          files = json.loads("{\"app/ui/app/src/components/ResponsePerformancePanel.tsx\":\"import type { ResponsePerformance } from \\\"@/gotypes\\\";\\nimport { ChartBarIcon } from \\\"@heroicons/react/24/outline\\\";\\n\\nconst number = (value: number, digits = 0) =>\\n  value.toLocaleString(\\\"pt-BR\\\", { maximumFractionDigits: digits, minimumFractionDigits: digits });\\nconst seconds = (ns: number) => number(ns / 1e9, 2) + \\\" s\\\";\\n\\nexport default function ResponsePerformancePanel({ performance: p, model }: {\\n  performance: ResponsePerformance;\\n  model?: string;\\n}) {\\n  const rows: [string, string][] = [];\\n  if (model) rows.push([\\\"Modelo\\\", model]);\\n  if (p.total_ns > 0) rows.push([\\\"Tempo da inferência\\\", seconds(p.total_ns)]);\\n  if (p.load_ns > 0) rows.push([\\\"Carregamento\\\", seconds(p.load_ns)]);\\n  if (p.prompt_tokens > 0) rows.push([\\\"Tokens de entrada processados\\\", number(p.prompt_tokens)]);\\n  if (p.prompt_ns > 0) rows.push([\\\"Processamento da entrada\\\", seconds(p.prompt_ns)]);\\n  if (p.generated_tokens > 0) rows.push([\\\"Tokens gerados (incl. Thinking)\\\", number(p.generated_tokens)]);\\n  if (p.generation_ns > 0) {\\n    rows.push([\\\"Tempo de geração\\\", seconds(p.generation_ns)]);\\n    if (p.generated_tokens > 0) rows.push([\\\"Velocidade de geração\\\", number(p.generated_tokens * 1e9 / p.generation_ns, 1) + \\\" t/s\\\"]);\\n  }\\n  if (p.size_bytes && p.size_bytes > 0) {\\n    const gpu = Math.round(100 * (p.vram_bytes ?? 0) / p.size_bytes);\\n    rows.push([\\\"Memória do modelo\\\", number(p.size_bytes / 1e9, 1) + \\\" GB\\\"]);\\n    rows.push([\\\"VRAM alocada\\\", number((p.vram_bytes ?? 0) / 1e9, 1) + \\\" GB\\\"]);\\n    rows.push([\\\"Distribuição CPU / GPU\\\", (100 - gpu) + \\\"% / \\\" + gpu + \\\"%\\\"]);\\n  }\\n  if (p.context_length && p.context_length > 0) rows.push([\\\"Contexto configurado\\\", number(p.context_length) + \\\" tokens\\\"]);\\n  if (rows.length === 0) return null;\\n  return (\\n    <details className=\\\"min-w-0 max-w-full pt-1 text-xs text-neutral-500 dark:text-neutral-400\\\">\\n      <summary className=\\\"cursor-pointer select-none list-none flex items-center gap-1.5 hover:text-neutral-800 dark:hover:text-neutral-200 [&::-webkit-details-marker]:hidden\\\">\\n        <ChartBarIcon className=\\\"w-4 h-4\\\" aria-hidden=\\\"true\\\" />\\n        <span>Desempenho</span>\\n        <span aria-hidden=\\\"true\\\">▾</span>\\n      </summary>\\n      <dl className=\\\"mt-2 grid grid-cols-[auto_1fr] gap-x-4 gap-y-1.5 tabular-nums\\\">\\n        {rows.map(([label, value]) => (\\n          <div key={label} className=\\\"contents\\\">\\n            <dt>{label}</dt><dd className=\\\"text-neutral-700 dark:text-neutral-300 break-words\\\">{value}</dd>\\n          </div>\\n        ))}\\n      </dl>\\n      <p className=\\\"mt-2 max-w-xs\\\">Última etapa de inferência. Memória registrada ao concluir, não uso instantâneo.</p>\\n    </details>\\n  );\\n}\\n\",\"app/store/gama_performance_test.go\":\"//go:build windows || darwin\\n\\npackage store\\n\\nimport (\\n\\t\\\"path/filepath\\\"\\n\\t\\\"testing\\\"\\n)\\n\\nfunc TestGamaPerformanceRoundtrip(t *testing.T) {\\n\\tpath := filepath.Join(t.TempDir(), \\\"performance.db\\\")\\n\\tdb, err := newDatabase(path)\\n\\tif err != nil { t.Fatal(err) }\\n\\tchat := NewChat(\\\"performance-test\\\")\\n\\tmsg := NewMessage(\\\"assistant\\\", \\\"test\\\", nil)\\n\\tchat.Messages = append(chat.Messages, msg)\\n\\tif err := db.saveChat(*chat); err != nil { t.Fatal(err) }\\n\\tmsg.Performance = &ResponsePerformance{TotalNS: 1000000000, GeneratedTokens: 30, SizeBytes: 100, VRAMBytes: 86}\\n\\tif err := db.updateLastMessage(chat.ID, msg); err != nil { t.Fatal(err) }\\n\\tif err := db.Close(); err != nil { t.Fatal(err) }\\n\\tdb, err = newDatabase(path)\\n\\tif err != nil { t.Fatal(err) }\\n\\tdefer db.Close()\\n\\tgot, err := db.getChatWithOptions(chat.ID, false)\\n\\tif err != nil { t.Fatal(err) }\\n\\tif len(got.Messages) != 1 || got.Messages[0].Performance == nil || *got.Messages[0].Performance != *msg.Performance { t.Fatalf(\\\"metrics not preserved: %+v\\\", got.Messages) }\\n\\tif err := db.saveChat(*got); err != nil { t.Fatal(err) }\\n\\tagain, err := db.getChatWithOptions(chat.ID, false)\\n\\tif err != nil { t.Fatal(err) }\\n\\tif len(again.Messages) != 1 || again.Messages[0].Performance == nil || *again.Messages[0].Performance != *msg.Performance { t.Fatal(\\\"metrics lost on chat save\\\") }\\n}\\n\"}")
          for filename, content in files.items():
              p = Path(filename)
              assert not p.exists(), f"File already exists: {filename}"
              p.write_text(content)
          PY
          git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version-file: source/go.mod
          cache: false
      - name: Test database migrations and response metrics roundtrip
        working-directory: source
        run: |
          gofmt -w app/store/store.go app/store/database.go app/store/gama_performance_test.go app/ui/ui.go
          go test ./app/store -run 'TestSchemaMigrations|TestSchemaVersioning|TestGamaPerformanceRoundtrip' -count=1
      - name: Build embedded desktop frontend
        working-directory: source/app/ui/app
        run: |
          npm ci
          npm run build
      - name: Build Intel desktop executable only
        working-directory: source
        shell: bash
        env:
          GOOS: darwin
          GOARCH: amd64
          CGO_ENABLED: '1'
          CGO_CFLAGS: '-O3 -mmacosx-version-min=14.0'
          CGO_CXXFLAGS: '-O3 -mmacosx-version-min=14.0'
          CGO_LDFLAGS: '-mmacosx-version-min=14.0'
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/result"
          go build -o "$GITHUB_WORKSPACE/result/Ollama" \
            -ldflags='-s -w -X=github.com/ollama/ollama/app/version.Version=0.40.10-24-gdc3d660' \
            ./app/cmd/app
          file "$GITHUB_WORKSPACE/result/Ollama"
          test "$(lipo -archs "$GITHUB_WORKSPACE/result/Ollama")" = x86_64
          otool -L "$GITHUB_WORKSPACE/result/Ollama"
          codesign --force --sign - "$GITHUB_WORKSPACE/result/Ollama"
          codesign --verify --strict "$GITHUB_WORKSPACE/result/Ollama"
          cd "$GITHUB_WORKSPACE/result"
          shasum -a 256 Ollama > SHA256SUMS.txt
          printf 'Fork revision: %s\nPatch base: %s\nPatch head: %s\n' "$FORK_REV" "$PATCH_BASE" "$PATCH_HEAD" > BUILD-INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: OllamaGPU-Thinking-Intel-v3
          path: result/
          if-no-files-found: error
          retention-days: 7
